<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>מרכז ההדרכה - פורום רכוסניק</title>
    <meta name="description" content="An interactive, guided simulation of a forum posting interface with automated cursor and typing effects." />
    <meta property="og:title" content="מרכז ההדרכה - רכוסניק" />
    <meta property="og:description" content="הדמיה אינטראקטיבית מותאמת ב-100% לפורום רכוסניק - פתיחת נושאים, עורך מפוצל, מעקב והתראות." />
    <link rel="icon" type="image/png" href="https://rchsnik.com/assets/uploads/system/site-logo.png" />
    
    <!-- Google Fonts: Heebo & Assistant matching rchsnik.com -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              heebo: ['Heebo', 'system-ui', 'sans-serif'],
              assistant: ['Assistant', 'system-ui', 'sans-serif'],
            },
            colors: {
              rchs: {
                navy: '#01263c',      /* Official forum dark blue */
                gold: '#caa34b',      /* Official forum gold */
                amber: '#DC9656',     /* Category 9 community color */
                blue: '#337ab7',      /* NodeBB link blue */
                hoverBlue: '#286090',
                bg: '#f4f7f9',
                border: '#dcdcdc',
              }
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="/index.css">
</head>
<body class="font-heebo bg-[#f4f7f9] text-[#212529] antialiased selection:bg-[#caa34b]/20 selection:text-[#01263c]">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
